name: Build Flower Kernel (Mi8937 Unified)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    name: Mi8937 Unified - ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: KSU
            ksu: true
          - variant: No-KSU
            ksu: false
    env:
      KERNEL_LOCAL_NAME: flower-kernel-happy-new-year-edition
      KERNEL_SOURCE_BRANCH: lineage-19.1

    steps:
      - name: Checkout Flower-Kernel
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential device-tree-compiler flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libelf-dev libncurses-dev libssl-dev lz4 make python3 zip

      - name: Clone LineageOS kernel source
        run: |
          git clone --depth=1 --branch "$KERNEL_SOURCE_BRANCH" \
            https://github.com/LineageOS/android_kernel_xiaomi_msm8937.git kernel
          echo "KERNEL_COMMIT=$(git -C kernel rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Using LineageOS branch: $KERNEL_SOURCE_BRANCH"
          git -C kernel log -1 --oneline

      - name: Integrate backslashxx KernelSU
        if: matrix.ksu
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh | bash

          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q '^config KSU$' drivers/kernelsu/Kconfig
          grep -q '^config KSU_TAMPER_SYSCALL_TABLE$' drivers/kernelsu/Kconfig
          grep -q '^config KSU_LSM_SECURITY_HOOKS$' drivers/kernelsu/Kconfig

          echo "KSU_COMMIT=$(git -C KernelSU rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "KernelSU integration verified."

      - name: Configure kernel
        working-directory: kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        shell: bash
        run: |
          set -euxo pipefail
          make O=out lineageos_mi8937_defconfig

          # Match the Yoru reference where supported by this KernelSU fork.
          scripts/config --file out/.config \
            --enable IKCONFIG \
            --enable IKCONFIG_PROC \
            --enable KPROBES \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --set-str LOCALVERSION "-${KERNEL_LOCAL_NAME}-${{ matrix.variant }}" \
            --disable LOCALVERSION_AUTO

          if [ "${{ matrix.ksu }}" = "true" ]; then
            scripts/config --file out/.config \
              --enable KSU \
              --enable KSU_TAMPER_SYSCALL_TABLE \
              --enable KSU_LSM_SECURITY_HOOKS \
              --enable KSU_FEATURE_ADBROOT \
              --enable KSU_HEURISTIC_IN_TREE_BUILD \
              --disable KSU_HACK_ARM64_BRANCH_LINK
          else
            scripts/config --file out/.config --disable KSU
          fi

          make O=out olddefconfig

          grep -q '^CONFIG_ARCH_MSM8937=y$' out/.config
          grep -q '^CONFIG_ARCH_MSM8917=y$' out/.config
          grep -q '^CONFIG_ARCH_MSM8940=y$' out/.config
          grep -q '^CONFIG_MACH_XIAOMI=y$' out/.config
          grep -q '^CONFIG_MACH_XIAOMI_LAND=y$' out/.config
          grep -q '^CONFIG_MACH_XIAOMI_ROVA=y$' out/.config
          grep -q '^CONFIG_MACH_XIAOMI_SANTONI=y$' out/.config
          grep -q '^CONFIG_MACH_XIAOMI_ULYSSE=y$' out/.config
          grep -q '^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y$' out/.config
          grep -q '^CONFIG_IKCONFIG=y$' out/.config
          grep -q '^CONFIG_IKCONFIG_PROC=y$' out/.config

          if [ "${{ matrix.ksu }}" = "true" ]; then
            grep -q '^CONFIG_KSU=y$' out/.config
            grep -q '^CONFIG_KSU_TAMPER_SYSCALL_TABLE=y$' out/.config
            grep -q '^CONFIG_KSU_LSM_SECURITY_HOOKS=y$' out/.config
            grep -q '^CONFIG_KSU_FEATURE_ADBROOT=y$' out/.config
          else
            ! grep -q '^CONFIG_KSU=y$' out/.config
          fi

          echo "=== Effective config ==="
          grep -E '^(CONFIG_(KSU|KSU_TAMPER_SYSCALL_TABLE|KSU_LSM_SECURITY_HOOKS|KSU_FEATURE_ADBROOT|KPROBES|KALLSYMS|KALLSYMS_ALL|IKCONFIG|IKCONFIG_PROC|ARCH_MSM8937|ARCH_MSM8917|ARCH_MSM8940|MACH_XIAOMI|MACH_XIAOMI_LAND|MACH_XIAOMI_ROVA|MACH_XIAOMI_SANTONI|MACH_XIAOMI_ULYSSE|BUILD_ARM64_APPENDED_DTB_IMAGE))=' out/.config || true

      - name: Build device trees first, then append them to Image.gz-dtb
        working-directory: kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        shell: bash
        run: |
          set -euxo pipefail

          # Match the known-working Yoru reference toolchain generation.
          aarch64-linux-gnu-gcc --version | head -n1
          arm-linux-gnueabi-gcc --version | head -n1

          # IMPORTANT: arm64/boot/Makefile discovers DTBs with find() while
          # make parses the file. Build DTBs in a separate invocation first,
          # otherwise Image.gz-dtb can be created before the DTBs exist.
          make -j"$(nproc)" O=out dtbs

          dtb_dir="out/arch/arm64/boot/dts/qcom"
          for dtb in \
            msm8917-pmi8937-mtp-ugglite.dtb \
            msm8940-pmi8937-mtp-ugg.dtb \
            msm8917-pmi8937-qrd-sku5-riva.dtb \
            msm8917-pmi8937-qrd-sku5-rolex.dtb \
            msm8937-pmi8950-qrd-land.dtb \
            msm8940-pmi8950-qrd-sku7-santoni.dtb; do
            test -s "$dtb_dir/$dtb"
          done

          # Start a fresh make invocation so DTB_OBJS sees the completed DTBs.
          make -j"$(nproc)" O=out Image.gz-dtb
          test -s out/arch/arm64/boot/Image.gz-dtb

          # Validate that the appended payload really contains all six family DTBs.
          python3 - <<'PY'
          import struct
          import zlib
          from pathlib import Path

          image = Path("out/arch/arm64/boot/Image.gz-dtb").read_bytes()
          dec = zlib.decompressobj(31)
          dec.decompress(image)
          dtb_payload = dec.unused_data

          magic = bytes.fromhex("d00dfeed")
          found = []
          pos = 0
          while True:
              pos = dtb_payload.find(magic, pos)
              if pos < 0:
                  break
              if pos + 8 <= len(dtb_payload):
                  size = struct.unpack(">I", dtb_payload[pos + 4:pos + 8])[0]
                  if 40 <= size <= len(dtb_payload) - pos:
                      found.append(dtb_payload[pos:pos + size])
                      pos += size
                      continue
              pos += 4

          if len(found) != 6:
              raise SystemExit(f"Expected 6 appended Mi8937-family DTBs, found {len(found)}")

          strings = b"".join(found)
          required = [
              b"qcom,msm8917-qrd-sku5",
              b"qcom,msm8937-qrd",
              b"qcom,msm8940-qrd",
              b"qcom,msm8917-mtp",
              b"qcom,msm8940",
          ]
          missing = [item.decode() for item in required if item not in strings]
          if missing:
              raise SystemExit("Missing required DTB compatibles: " + ", ".join(missing))

          print("Validated six appended DTBs for the Mi8937 family.")
          PY

      - name: Package AnyKernel3 unified installer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git

          cat > anykernel/anykernel.sh <<'AKSCRIPT'
          ### AnyKernel3 installer for Flower Kernel - Mi8937 family
          properties() { '
          kernel.string=Flower Kernel - Happy New Year Edition
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=rolex
          device.name2=riva
          device.name3=rova
          device.name4=land
          device.name5=santoni
          device.name6=ugglite
          device.name7=ugg
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          boot_attributes() {
          set_perm_recursive 0 0 755 644 "$RAMDISK"/*;
          set_perm_recursive 0 0 750 750 "$RAMDISK"/init* "$RAMDISK"/sbin;
          }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          AKSCRIPT

          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/
          : > anykernel/banner

          {
            echo "Kernel name: flower-kernel-happy-new-year-edition"
            echo "Variant: ${{ matrix.variant }}"
            echo "Kernel source: LineageOS/android_kernel_xiaomi_msm8937"
            echo "Source branch: $KERNEL_SOURCE_BRANCH"
            echo "Source commit: $KERNEL_COMMIT"
            echo "Defconfig: lineageos_mi8937_defconfig"
            echo "Kernel image: Image.gz-dtb"
            echo "Device family configuration: MSM8937 / MSM8917 / MSM8940"
            echo "Xiaomi board configs: LAND, ROVA, SANTONI, ULYSSE"
            echo "AnyKernel aliases: rolex, riva, rova, land, santoni, ugglite, ugg"
            echo "KernelSU: ${{ matrix.ksu }}"
            if [ "${{ matrix.ksu }}" = "true" ]; then
              echo "KernelSU source: backslashxx/KernelSU"
              echo "KernelSU commit: $KSU_COMMIT"
              echo "KernelSU hook: syscall table tampering + LSM security hooks"
            else
              echo "KernelSU: not integrated"
            fi
            printf 'Kernel version: '
            make -s -C kernel O=out ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- kernelversion
          } > anykernel/BUILD-INFO.txt

          zip_name="Flower-Kernel-Mi8937-${{ matrix.variant }}.zip"
          (cd anykernel && zip -qr "../release/$zip_name" .)
          test -f "release/$zip_name"
          test "$(unzip -l "release/$zip_name" | awk '$4 == "banner" {print $1}')" = "0"
          cp kernel/out/.config "release/kernel-${{ matrix.variant }}.config"
          cp anykernel/BUILD-INFO.txt "release/BUILD-INFO-${{ matrix.variant }}.txt"
          ls -lh release/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flower-Kernel-Mi8937-${{ matrix.variant }}
          path: release/
          if-no-files-found: error
          retention-days: 14
