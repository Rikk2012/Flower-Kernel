name: Build Flower Kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout Flower-Kernel
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev lz4 make python3

      - name: Clone LineageOS kernel source
        run: |
          git clone --depth=1 --branch lineage-19.1 https://github.com/LineageOS/android_kernel_xiaomi_msm8937.git kernel

      - name: Verify kernel version and configure
        working-directory: kernel
        run: |
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile | head -3
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- lineageos_mi8937_defconfig
          scripts/config --file out/.config --enable KPROBES --enable KALLSYMS --enable KALLSYMS_ALL
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel and device trees
        working-directory: kernel
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image.gz dtbs

      - name: Collect build output
        run: |
          mkdir -p release
          cp kernel/out/arch/arm64/boot/Image.gz release/
          find kernel/out/arch/arm64/boot/dts -type f \( -name '*.dtb' -o -name '*.dtbo' \) -exec cp --parents {} release/ \;
          cp kernel/out/.config release/kernel.config
          printf 'Source: LineageOS/android_kernel_xiaomi_msm8937@lineage-19.1\nKernel: ' > release/BUILD-INFO.txt
          make -s -C kernel O=out ARCH=arm64 kernelversion >> release/BUILD-INFO.txt
          cat release/BUILD-INFO.txt

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flower-Kernel-riva-lineage-19.1
          path: release/
          if-no-files-found: error
          retention-days: 14
