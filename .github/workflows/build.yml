        uses: actions/upload-artifact@v4
        with:
          name: Flower-Kernel-Mi8937-${{ matrix.variant }}
          path: release/
          if-no-files-found: error
          retention-days: 14
 out/.config
          grep -q '^CONFIG_MACH_XIAOMI_PRADA=y          grep -q '^CONFIG_IKCONFIG_PROC=y$' out/.config

          if [ "${{ matrix.ksu }}" = "true" ]; then
            grep -q '^CONFIG_KSU=y$' out/.config
            grep -q '^CONFIG_KSU_TAMPER_SYSCALL_TABLE=y$' out/.config
            grep -q '^CONFIG_KSU_LSM_SECURITY_HOOKS=y$' out/.config
            grep -q '^CONFIG_KSU_FEATURE_ADBROOT=y$' out/.config
          else
            ! grep -q '^CONFIG_KSU=y$' out/.config
          fi

          echo "=== Effective config ==="
          grep -E '^(CONFIG_(KSU|KSU_TAMPER_SYSCALL_TABLE|KSU_LSM_SECURITY_HOOKS|KSU_FEATURE_ADBROOT|KPROBES|KALLSYMS|KALLSYMS_ALL|IKCONFIG|IKCONFIG_PROC|ARCH_MSM8937|ARCH_MSM8917|ARCH_MSM8940|MACH_XIAOMI|MACH_XIAOMI_LAND|MACH_XIAOMI_ROVA|MACH_XIAOMI_SANTONI|MACH_XIAOMI_ULYSSE|BUILD_ARM64_APPENDED_DTB_IMAGE))=' out/.config || true

