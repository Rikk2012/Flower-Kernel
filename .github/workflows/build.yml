          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=rolex
          device.name2=riva
          device.name3=rova
          device.name4=land
          device.name5=prada
          device.name6=santoni
          device.name7=ugglite
          device.name8=ugg
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          boot_attributes() {
          set_perm_recursive 0 0 755 644 "$RAMDISK"/*;
          set_perm_recursive 0 0 750 750 "$RAMDISK"/init* "$RAMDISK"/sbin;
          }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          AKSCRIPT

          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/
          : > anykernel/banner

          {
            echo "Kernel name: flower-kernel-happy-new-year-edition"
            echo "Variant: ${{ matrix.variant }}"
            echo "Kernel source: LineageOS/android_kernel_xiaomi_msm8937"
            echo "Source branch: $KERNEL_SOURCE_BRANCH"
            echo "Source commit: $KERNEL_COMMIT"
            echo "Defconfig: lineageos_mi8937_defconfig"
            echo "Kernel image: Image.gz-dtb"
            echo "Device family configuration: MSM8937 / MSM8917 / MSM8940"
            echo "Xiaomi board configs: LAND, ROVA, SANTONI, ULYSSE"
            echo "AnyKernel aliases: rolex, riva, rova, land, prada, santoni, ugglite, ugg"
            echo "KernelSU: ${{ matrix.ksu }}"
            if [ "${{ matrix.ksu }}" = "true" ]; then
              echo "KernelSU source: backslashxx/KernelSU"
              echo "KernelSU commit: $KSU_COMMIT"
              echo "KernelSU hook: syscall table tampering + LSM security hooks"
            else
              echo "KernelSU: not integrated"
            fi
            printf 'Kernel version: '
            make -s -C kernel O=out ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- kernelversion
          } > anykernel/BUILD-INFO.txt

          zip_name="Flower-Kernel-Mi8937-${{ matrix.variant }}.zip"
          (cd anykernel && zip -qr "../release/$zip_name" .)
          test -f "release/$zip_name"
          test "$(unzip -l "release/$zip_name" | awk '$4 == "banner" {print $1}')" = "0"
          cp kernel/out/.config "release/kernel-${{ matrix.variant }}.config"
          cp anykernel/BUILD-INFO.txt "release/BUILD-INFO-${{ matrix.variant }}.txt"
          ls -lh release/

