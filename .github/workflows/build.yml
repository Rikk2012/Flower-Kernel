        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        shell: bash
        run: |
          set -euxo pipefail

          # Match the known-working Yoru reference toolchain generation.
          aarch64-linux-gnu-gcc --version | head -n1
